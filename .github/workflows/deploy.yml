name: deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: sync web portal lookup
        run: node scripts/sync-web-portals.js

      - name: build live dataset
        run: node scripts/build-headlines-dataset.js
        continue-on-error: true

      - name: cache OG images
        run: node scripts/cache-og-images.js
        continue-on-error: true

      - name: install chromium for verify gate
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: stamp build
        run: printf '{"build":"%s"}\n' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > web/build.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./web

      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: verify live page renders headlines
        env:
          CHROME_BIN: /usr/bin/chromium-browser
          VERIFY_MAX_TRIES: '45'
        run: scripts/verify-live.sh https://helmedeiros.github.io/geo-news/ "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
